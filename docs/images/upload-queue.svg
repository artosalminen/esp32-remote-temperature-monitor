<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Upload queue: points measured during an internet outage are sent later with their original timestamps</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="275" rx="12" fill="#ffffff"/>

  <!-- outage band -->
  <rect x="330" y="24" width="248" height="96" rx="6" fill="#fee2e2"/>
  <text x="454" y="42" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">internet down</text>

  <text x="24" y="86" font-weight="600" fill="#334155">On the board</text>
  <!-- 20 points, 31 px apart, starting x=150 -->
  <g>
    <rect x="150" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="181" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="212" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="243" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="274" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="305" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="336" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="367" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="398" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="429" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="460" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="491" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="522" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="553" y="70" width="22" height="22" rx="4" fill="#f59e0b"/>
    <rect x="584" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="615" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="646" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="677" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="708" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="739" y="70" width="22" height="22" rx="4" fill="#2563eb"/>
  </g>
  <text x="150" y="112" font-size="12" fill="#475569">one point every 2 min ▸ time</text>

  <!-- catch-up arrow -->
  <path d="M454 124 L454 176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="466" y="140" font-size="12" fill="#334155">back online: the queue is sent in bulk,</text>
  <text x="466" y="155" font-size="12" fill="#334155">≤100 points per request every 20 s,</text>
  <text x="466" y="170" font-size="12" fill="#334155">each with its original <tspan font-family="ui-monospace, Consolas, monospace">created_at</tspan></text>

  <text x="24" y="206" font-weight="600" fill="#334155">In ThingSpeak</text>
  <g fill="#7c3aed" transform="translate(0 10)">
    <rect x="150" y="180" width="22" height="22" rx="4"/>
    <rect x="181" y="180" width="22" height="22" rx="4"/>
    <rect x="212" y="180" width="22" height="22" rx="4"/>
    <rect x="243" y="180" width="22" height="22" rx="4"/>
    <rect x="274" y="180" width="22" height="22" rx="4"/>
    <rect x="305" y="180" width="22" height="22" rx="4"/>
    <rect x="336" y="180" width="22" height="22" rx="4"/>
    <rect x="367" y="180" width="22" height="22" rx="4"/>
    <rect x="398" y="180" width="22" height="22" rx="4"/>
    <rect x="429" y="180" width="22" height="22" rx="4"/>
    <rect x="460" y="180" width="22" height="22" rx="4"/>
    <rect x="491" y="180" width="22" height="22" rx="4"/>
    <rect x="522" y="180" width="22" height="22" rx="4"/>
    <rect x="553" y="180" width="22" height="22" rx="4"/>
    <rect x="584" y="180" width="22" height="22" rx="4"/>
    <rect x="615" y="180" width="22" height="22" rx="4"/>
    <rect x="646" y="180" width="22" height="22" rx="4"/>
    <rect x="677" y="180" width="22" height="22" rx="4"/>
    <rect x="708" y="180" width="22" height="22" rx="4"/>
    <rect x="739" y="180" width="22" height="22" rx="4"/>
  </g>
  <text x="150" y="232" font-size="12" fill="#475569">no gap: every point at the time it was measured</text>

  <g font-size="12" fill="#475569">
    <rect x="24" y="248" width="12" height="12" rx="2" fill="#2563eb"/><text x="42" y="258">sent right away</text>
    <rect x="160" y="248" width="12" height="12" rx="2" fill="#f59e0b"/><text x="178" y="258">queued in RAM</text>
  </g>
</svg>
