<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Data flow: the ESP32 in the garage only makes outgoing connections</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="12" fill="#ffffff"/>

  <!-- Garage -->
  <rect x="20" y="20" width="370" height="340" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="36" y="44" font-weight="600" fill="#334155">Garage</text>
  <text x="36" y="62" font-size="12" fill="#64748b">WiFi only: no server, no open ports</text>

  <rect x="40" y="90" width="120" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="100" y="114" text-anchor="middle" fill="#0c4a6e" font-weight="600">DS18S20</text>
  <text x="100" y="132" text-anchor="middle" font-size="12" fill="#0c4a6e">read every 30 s</text>

  <rect x="210" y="80" width="160" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="290" y="104" text-anchor="middle" fill="#14532d" font-weight="600">ESP32 · ESPHome</text>
  <text x="290" y="126" text-anchor="middle" font-size="12" fill="#14532d">2-min averages</text>
  <text x="290" y="144" text-anchor="middle" font-size="12" fill="#14532d">14 days in RAM (20 KB)</text>
  <text x="290" y="162" text-anchor="middle" font-size="12" fill="#14532d">SNTP clock · upload queue</text>
  <line x1="160" y1="118" x2="206" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="183" y="110" text-anchor="middle" font-size="11" fill="#475569">1-Wire</text>

  <rect x="40" y="260" width="150" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="115" y="285" text-anchor="middle" fill="#713f12" font-weight="600">Phones &amp; laptops</text>
  <text x="115" y="304" text-anchor="middle" font-size="12" fill="#713f12">on the garage WiFi</text>
  <path d="M250 190 L250 225 L115 225 L115 256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="246" font-size="12" fill="#334155">http://tempmon.local/</text>
  <text x="262" y="263" font-size="12" fill="#64748b">read-only page + chart</text>

  <!-- ThingSpeak -->
  <rect x="480" y="90" width="150" height="70" rx="35" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="555" y="120" text-anchor="middle" fill="#4c1d95" font-weight="600">ThingSpeak</text>
  <text x="555" y="139" text-anchor="middle" font-size="12" fill="#4c1d95">long-term history</text>
  <line x1="370" y1="125" x2="476" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="423" y="110" text-anchor="middle" font-size="12" fill="#334155">HTTPS out</text>
  <text x="423" y="144" text-anchor="middle" font-size="11" fill="#64748b">every 2 min,</text>
  <text x="423" y="158" text-anchor="middle" font-size="11" fill="#64748b">timestamped</text>

  <!-- Home -->
  <rect x="420" y="200" width="360" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="436" y="224" font-weight="600" fill="#334155">Home</text>
  <rect x="480" y="262" width="150" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="555" y="288" text-anchor="middle" fill="#0c4a6e" font-weight="600">Home Assistant</text>
  <text x="555" y="306" text-anchor="middle" font-size="12" fill="#0c4a6e">Scrape sensors</text>
  <line x1="555" y1="162" x2="555" y2="258" stroke="#475569" stroke-width="2" marker-start="url(#a)"/>
  <text x="566" y="216" font-size="12" fill="#334155">polled every 10 min</text>
  <text x="566" y="232" font-size="11" fill="#64748b">(HTTPS out from home)</text>
  <rect x="660" y="262" width="100" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="710" y="288" text-anchor="middle" fill="#7f1d1d" font-weight="600">Telegram</text>
  <text x="710" y="306" text-anchor="middle" font-size="12" fill="#7f1d1d">silent alert</text>
  <line x1="630" y1="292" x2="656" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- No inbound -->
  <line x1="470" y1="345" x2="396" y2="345" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="380" y="349" text-anchor="end" font-size="12" fill="#dc2626">✕ nothing connects in</text>
</svg>
