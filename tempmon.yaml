# Tempmon — remote-site temperature monitor (ESPHome). See README.md.
# Board: ESP32 WROOM dev board (e.g. NodeMCU-32S / DevKitC)
# Sensor: DS18S20 / DS18B20 on GPIO13 (needs 4.7k pull-up DATA -> 3V3)
#
# Public (no login), on the site's WiFi:  http://tempmon.local/  (or the board's IP)
#   current temperature + 24 h / 3 d / 7 d / 14 d chart of 2-min averages kept in RAM.
#   Read-only: the device has no settings reachable over the network.
# Long-term history: every 2-min average is pushed to a private ThingSpeak channel
#   (field1 = °C, field2 = WiFi RSSI); e.g. Home Assistant can read it from there.
#
# WiFi: knows two networks (remote site + home) and joins whichever it finds.
# Anywhere else: if neither network is found for 1 min, the board
# opens hotspot "Tempmon Setup" (WPA2, password tempmon_ap_password). Join with a
# phone -> captive portal opens (or browse to 192.168.4.1) -> pick the local WiFi.
# Credentials saved there are stored on the board and override the compiled ones.

substitutions:
  ts_key: !secret thingspeak_write_key

esphome:
  name: tempmon
  friendly_name: Tempmon
  includes:
    - tempmon_web.h
  on_boot:
    priority: -100
    then:
      - lambda: 'tempmon::start_web();'

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret tempmon_ota_password

safe_mode:

wifi:
  networks:
    - ssid: !secret remote_wifi_ssid       # remote site
      password: !secret remote_wifi_password
    - ssid: !secret wifi_ssid              # home, for testing / updates
      password: !secret wifi_password
  ap:
    ssid: "Tempmon Setup"
    password: !secret tempmon_ap_password
    ap_timeout: 1min

captive_portal:

http_request:
  timeout: 10s
  # verify_ssl defaults to true (ESP-IDF certificate bundle)

one_wire:
  - platform: gpio
    pin: GPIO13

sensor:
  - platform: wifi_signal
    id: rssi
    name: "WiFi signal"
    update_interval: 60s

  - platform: dallas_temp
    id: temp
    name: "Temperature"
    update_interval: 30s   # 4 readings averaged per 2-min point
    on_value:
      - lambda: 'tempmon::add_reading(x);'

interval:
  - interval: 2min   # must match STEP_S in tempmon_web.h
    then:
      - lambda: 'id(avg5) = tempmon::commit();'
      - if:
          condition:
            lambda: 'return !std::isnan(id(avg5)) && wifi::global_wifi_component->is_connected();'
          then:
            - http_request.get:
                url: !lambda |-
                  return str_sprintf(
                    "https://api.thingspeak.com/update?api_key=%s&field1=%.2f&field2=%.0f",
                    "${ts_key}", id(avg5), id(rssi).state);
                on_response:
                  then:
                    - logger.log:
                        format: "ThingSpeak: HTTP %d"
                        args: ["response->status_code"]

globals:
  - id: avg5
    type: float
    initial_value: 'NAN'
