# Tempmon — remote-site temperature monitor (ESPHome). See README.md.
# Board: ESP32 WROOM dev board (e.g. NodeMCU-32S / DevKitC)
# Sensor: DS18S20 / DS18B20 on GPIO13 (needs 4.7k pull-up DATA -> 3V3)
#
# Public (no login), on the site's WiFi:  http://tempmon.local/  (or the board's IP)
#   current temperature + 24 h / 3 d / 7 d / 14 d chart of 2-min averages kept in RAM.
#   Read-only: the device has no settings reachable over the network.
# Long-term history: every 2-min average is pushed to a ThingSpeak channel
#   (field1 = °C, field2 = WiFi RSSI), stamped with its measurement time (SNTP).
#   Points not yet uploaded (internet outage) are kept and sent later.
#   e.g. Home Assistant can read it from there.
#
# WiFi: knows two networks (remote site + home) and joins whichever it finds.
# Anywhere else: if neither network is found for 1 min, the board
# opens hotspot "Tempmon Setup" (WPA2, password tempmon_ap_password). Join with a
# phone -> captive portal opens (or browse to 192.168.4.1) -> pick the local WiFi.
# Credentials saved there are stored on the board and override the compiled ones.

substitutions:
  ts_key: !secret thingspeak_write_key
  ts_channel: !secret thingspeak_channel_id

esphome:
  name: tempmon
  friendly_name: Tempmon
  includes:
    - tempmon_web.h
  on_boot:
    priority: -100
    then:
      - lambda: 'tempmon::start_web();'

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret tempmon_ota_password

safe_mode:

wifi:
  networks:
    - ssid: !secret remote_wifi_ssid       # remote site
      password: !secret remote_wifi_password
    - ssid: !secret wifi_ssid              # home, for testing / updates
      password: !secret wifi_password
  ap:
    ssid: "Tempmon Setup"
    password: !secret tempmon_ap_password
    ap_timeout: 1min

captive_portal:

http_request:
  timeout: 10s
  # verify_ssl defaults to true (ESP-IDF certificate bundle)

one_wire:
  - platform: gpio
    pin: GPIO13

sensor:
  - platform: wifi_signal
    id: rssi
    name: "WiFi signal"
    update_interval: 60s

  - platform: dallas_temp
    id: temp
    name: "Temperature"
    update_interval: 30s   # 4 readings averaged per 2-min point
    on_value:
      - lambda: 'tempmon::add_reading(x);'

time:
  - platform: sntp          # default servers: 0/1/2.pool.ntp.org
    id: sntp_time
    timezone: Europe/Helsinki   # only affects log output; data is stored/sent in UTC

interval:
  # Close a 2-min averaging window and timestamp it.
  - interval: 2min   # must match STEP_S in tempmon_web.h
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          tempmon::commit(now.is_valid() ? (uint32_t) now.timestamp : 0);

  # Upload pending points with their measurement times. Normally that's one point per
  # 2 min; after an internet outage the backlog goes out in batches of 100 every 20 s
  # (ThingSpeak's bulk-update API wants >= 15 s between calls).
  - interval: 20s
    then:
      - if:
          condition:
            lambda: |-
              if (!wifi::global_wifi_component->is_connected()) return false;
              id(ts_body) = tempmon::build_upload("${ts_key}", id(rssi).state);
              return !id(ts_body).empty();
          then:
            - http_request.post:
                url: "https://api.thingspeak.com/channels/${ts_channel}/bulk_update.json"
                request_headers:
                  Content-Type: application/json
                body: !lambda 'return id(ts_body);'
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 202) {
                          ESP_LOGD("tempmon", "ThingSpeak: uploaded %d point(s)", tempmon::hist.inflight);
                          tempmon::upload_ack();
                        } else {
                          ESP_LOGW("tempmon", "ThingSpeak: HTTP %d, will retry", response->status_code);
                        }
            - lambda: 'id(ts_body).clear();'

globals:
  - id: ts_body
    type: std::string
