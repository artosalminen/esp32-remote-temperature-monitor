# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored.

# WiFi at the remote site (where the monitor lives)
remote_wifi_ssid: "SITE_WIFI_NAME"
remote_wifi_password: "SITE_WIFI_PASSWORD"

# Second WiFi, e.g. home — handy for testing and OTA updates before deployment
wifi_ssid: "HOME_WIFI_NAME"
wifi_password: "HOME_WIFI_PASSWORD"

# Password of the fallback setup hotspot "Tempmon Setup" (min. 8 characters)
tempmon_ap_password: "CHANGE_ME_long_random"

# Password for over-the-air firmware updates
tempmon_ota_password: "CHANGE_ME_long_random"

# ThingSpeak channel → API Keys → Write API Key, and the channel's numeric ID
thingspeak_write_key: "XXXXXXXXXXXXXXXX"
thingspeak_channel_id: "1234567"
