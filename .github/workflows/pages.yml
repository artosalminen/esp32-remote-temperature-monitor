name: Deploy PWA to GitHub Pages

# Publishes pwa/ to this repository's GitHub Pages site.
# Configuration comes from repository variables (Settings → Secrets and variables → Actions →
# Variables), not from the code:
#   THINGSPEAK_CHANNEL_ID  (required)  ID of the public ThingSpeak channel the app reads
on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        env:
          CHANNEL: ${{ vars.THINGSPEAK_CHANNEL_ID }}
        run: |
          if ! [[ "$CHANNEL" =~ ^[0-9]+$ ]]; then
            echo "::error::Set the THINGSPEAK_CHANNEL_ID repository variable to your ThingSpeak channel ID (digits only)."
            exit 1
          fi
          mkdir -p _site
          cp -R pwa/. _site/
          sed -i "s/__THINGSPEAK_CHANNEL_ID__/$CHANNEL/" _site/core.js
          grep -q "'$CHANNEL'" _site/core.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
