name: Deploy PWA to GitHub Pages

# Publishes pwa/ at https://slmnn.fi/esp32-remote-temperature-monitor/
# (slmnn.fi/tempmon redirects there from the artosalminen.github.io site).
on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R pwa/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
