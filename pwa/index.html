<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempmon</title>
<meta name="description" content="Remote temperature monitor with configurable alerts">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempmon">
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--card:#f6f7f9;--low:#0891b2;--high:#dc2626;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--line:#2a2f36;--acc:#60a5fa;--card:#1a1e24;--low:#22d3ee;--high:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.now{font-size:64px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.mut{color:var(--mut);font-size:14px}
.warn{color:var(--warn)}
.stats{display:flex;gap:24px;margin:12px 0 20px;flex-wrap:wrap}
.stats b{display:block;font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
svg{width:100%;height:260px;display:block;margin-top:10px}
svg text{fill:var(--mut);font-size:11px}
.icon{padding:8px;line-height:0}
.icon svg{width:22px;height:22px;margin:0}
section.card{background:var(--card);border-radius:10px;padding:16px;margin-top:24px}
section.card h2{font-size:18px;margin:0 0 12px}
label.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
label.row:first-of-type{border-top:0}
label.row span small{display:block;color:var(--mut);font-size:13px}
input[type=number]{font:inherit;width:6.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dl.status{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:14px}
dl.status dt{color:var(--mut)}
dl.status dd{margin:0}
.ok{color:#16a34a}
.legend{display:flex;gap:16px;margin-top:6px}
.legend i{display:inline-block;width:16px;border-top:2px dashed;vertical-align:middle;margin-right:6px}
[hidden]{display:none!important}
</style></head><body><main>
<header>
  <div>
    <div class="mut">Current temperature</div>
    <div class="now" id="now">–</div>
    <div class="mut" id="upd">Loading…</div>
  </div>
  <button class="icon" id="openSettings" aria-label="Alert settings" title="Alert settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  </button>
</header>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs">
  <button data-r="1d" class="on">24 h</button><button data-r="3d">3 days</button><button data-r="7d">7 days</button><button data-r="14d">14 days</button><button data-r="30d">30 days</button><button data-r="90d">90 days</button>
</div>
<svg id="c" viewBox="0 0 700 260" preserveAspectRatio="none" role="img" aria-label="Temperature chart"></svg>
<div class="legend mut" id="legend" hidden></div>
<div class="mut" style="margin-top:8px" id="res"></div>

<section class="card" id="settings" hidden>
  <h2>Alerts on this device</h2>
  <label class="row"><span>Alerts enabled<small>Settings are stored only on this device.</small></span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>Low limit (°C)<small>Alert when the temperature drops below this. Leave empty for no limit.</small></span><input type="number" id="low" step="0.5" inputmode="decimal" placeholder="off"></label>
  <label class="row"><span>High limit (°C)<small>Alert when the temperature rises above this. Leave empty for no limit.</small></span><input type="number" id="high" step="0.5" inputmode="decimal" placeholder="off"></label>
  <label class="row"><span>Sensor offline after (min)<small>Alert when no new data arrives for this long. Leave empty for no alert.</small></span><input type="number" id="offlineMin" step="5" min="10" inputmode="numeric" placeholder="off"></label>
  <label class="row"><span>Hysteresis (°C)<small>How far back inside the limit the temperature must come to count as normal again.</small></span><input type="number" id="hyst" step="0.1" min="0" inputmode="decimal"></label>
  <label class="row"><span>Notify when back to normal</span><input type="checkbox" id="recover"></label>
  <div class="actions">
    <button class="primary" id="save">Save</button>
    <button id="test">Send test notification</button>
    <button id="closeSettings">Close</button>
  </div>
  <div class="mut" id="saved" role="status" style="margin-top:8px"></div>
  <dl class="status" id="status"></dl>
</section>
</main>
<script src="core.js"></script>
<script src="app.js"></script>
</body></html>
